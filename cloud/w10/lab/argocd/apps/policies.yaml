apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: image-policies
  namespace: argocd
  annotations:
    # Chạy SAU policy-controller đã cài xong CRD
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    repoURL: https://github.com/G-03-XBrain-Phase-2/huypp-aws-accelerator-p2.git
    path: cloud/w10/lab/signing
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: default  # ClusterImagePolicy là cluster-scoped resource
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
