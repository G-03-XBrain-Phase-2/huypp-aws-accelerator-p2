apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-rbac
  namespace: argocd
spec:
  project: default  
  source:
    repoURL: https://github.com/G-03-XBrain-Phase-2/huypp-aws-accelerator-p2.git
    path: cloud/w10/lab/rbac
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc  
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true


      