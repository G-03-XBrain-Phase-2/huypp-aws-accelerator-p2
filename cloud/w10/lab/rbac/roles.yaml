#Alice role
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: developer-role
  namespace: demo
rules:
- apiGroups: ["","apps","batch"]
  resources: ["pods", "deployments", "services", "replicasets", "statefulsets"]
  verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]
---
#Bob role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-role
rules:
- apiGroups: [""]
  resources: ["pods", "pods/exec", "pods/log", "pods/status"]
  verbs: ["get", "list", "watch", "create", "update", "delete", "patch"]

---
#Carol role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: viewer-role
rules:
- apiGroups: ["*"]
  resources: ["*"]
  verbs: ["get", "list", "watch"]