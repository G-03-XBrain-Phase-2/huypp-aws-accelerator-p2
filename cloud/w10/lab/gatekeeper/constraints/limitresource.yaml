apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sContainerLimits
metadata:
  name: container-must-have-limits
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
    excludedNamespaces:
      - kube-system
      - eso
      - argocd
      - monitoring
      - gatekeeper-system
      - argo-rollouts
      - cert-manager
  parameters:
    cpu: "200m"
    memory: "1Gi"