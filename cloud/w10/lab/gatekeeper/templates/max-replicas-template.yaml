apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8smaxreplicas
spec:
  crd:
    spec:
      names:
        kind: K8sMaxReplicas
      validation:
        # Định nghĩa tham số đầu vào nhận từ Constraint
        openAPIV3Schema:
          type: object
          properties:
            max:
              type: integer
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8smaxreplicas

        violation[{"msg": msg}] {
          # Lấy số lượng replicas từ manifest đang chuẩn bị deploy
          replicas := input.review.object.spec.replicas
          
          # Lấy tham số 'max' cấu hình từ Constraint
          max_allowed := input.parameters.max
          
          # Điều kiện vi phạm: Số lượng replicas lớn hơn mức cho phép
          replicas > max_allowed
          
          # Thông báo lỗi trả về cho user khi bị reject
          msg := sprintf("Số lượng replicas (%v) vượt quá mức cho phép tối đa là %v!", [replicas, max_allowed])
        }