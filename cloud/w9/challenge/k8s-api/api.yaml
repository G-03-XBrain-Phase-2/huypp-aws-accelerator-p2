apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: demo-challenge
  labels:
    app: api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: w9-api:1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: ERROR_RATE
          value: "1"
        - name: VERSION
          value: "v-bad-revert"
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
  strategy:
    canary:
      canaryService: api-canary
      steps:
      - setWeight: 25
      - analysis:
          templates:
          - templateName: api-5xx-rate
      - setWeight: 50
      - pause:
          duration: 30s
      - setWeight: 100
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo-challenge
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-canary
  namespace: demo-challenge
  labels:
    app: api
    track: canary
spec:
  selector:
    app: api
  ports:
  - name: http
    port: 8080
    targetPort: 8080
