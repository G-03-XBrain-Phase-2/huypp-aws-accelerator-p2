# Build and push Docker image to GitHub Container Registry
name: Build and Push Image

on:
  push:
    branches:
      - main
    paths:
      - 'cloud/w10/lab/src/api/**'
      - '.github/workflows/build-push.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ secrets.GHCR_USERNAME }}/w10-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate semantic version
        id: semver
        uses: paulhatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(BREAKING CHANGE:|!:)"
          minor_pattern: "^feat"
          version_format: "${major}.${minor}.${patch}"
          bump_each_commit: false

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.CR_PAT }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.semver.outputs.version }}
            type=sha,prefix=v${{ steps.semver.outputs.version }}-

      # 1. Build image cục bộ trên máy GitHub để kiểm tra bảo mật trước
      - name: Build image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: ./cloud/w10/lab/src/api
          push: false # Không push lên vội để Trivy quét trước
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.semver.outputs.version }}
          labels: ${{ steps.meta.outputs.labels }}

      # 2. Dùng Trivy để quét lỗ hổng bảo mật nặng (HIGH, CRITICAL)
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.semver.outputs.version }}
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1' # CI sẽ báo đỏ và DỪNG luồng ngay nếu phát hiện CVE nguy hiểm
          ignore-unfixed: true

      # 3. Thực hiện đẩy (push) image lên GHCR sau khi đã sạch CVE
      - name: Push Docker image to registry
        uses: docker/build-push-action@v6
        with:
          context: ./cloud/w10/lab/src/api
          push: true # Đẩy các tag phiên bản lên registry công khai
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # 4. Cài đặt Cosign và ký số xác thực ảnh số
      - name: Install Cosign
        uses: sigstore/cosign-installer@main

      - name: Sign the published Docker image
        run: |
          echo "${{ secrets.COSIGN_PRIVATE_KEY }}" > cosign.key
          # Ký số chính xác vào tag SemVer mà manifest ứng dụng sẽ gọi dưới cụm
          cosign sign --key cosign.key --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.semver.outputs.version }}
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}

      # 5. Cập nhật manifest rollout.yaml tự động cập nhật phiên bản (GitOps)
      - name: Update rollout.yaml with new version
        run: |
          sed -i "s|image: ghcr.io/.*/w10-api:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.semver.outputs.version }}|g" cloud/w10/lab/app-api/rollout.yaml
          sed -i "s|value: \"v.*\"|value: \"v${{ secrets.semver.outputs.version }}\"|g" cloud/w10/lab/app-api/rollout.yaml

      - name: Commit and push version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cloud/w10/lab/app-api/rollout.yaml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: bump version to v${{ steps.semver.outputs.version }}"
            git push
          fi

      - name: Create git tag
        run: |
          git tag v${{ steps.semver.outputs.version }}
          git push origin v${{ steps.semver.outputs.version }}